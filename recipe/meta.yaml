{% set name = "thrift" %}
{% set version = "0.22.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/thrift-{{ version }}.tar.gz
  sha256: 42e8276afbd5f54fe1d364858b6877bc5e5a4a5ed69f6a005b94ca4918fe1466

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    # https://github.com/apache/thrift/blob/v0.22.0/lib/py/setup.py#L84
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
  run_constrained:
    - tornado >=4.0

# Tests disabled.
# E   ModuleNotFoundError: No module named '_import_local_thrift'
test:
  imports:
    - thrift
    - thrift.protocol
    - thrift.server
    - thrift.transport
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://thrift.apache.org
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  description: |
    Thrift is a lightweight, language-independent software stack for point-to-point RPC implementation.
    Thrift provides clean abstractions and implementations for data transport, data serialization, and application level processing.
  summary: Python bindings for the Apache Thrift RPC system
  dev_url: https://github.com/apache/thrift
  doc_url: https://thrift.apache.org/docs

extra:
  recipe-maintainers:
    - mariusvniekerk
    - ericdill
    - marshall245
