{% set name = "thrift" %}
{% set version = "0.25.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e85615ae9245f5622a5e36a9d2d867e1e7b17a8ca467b257dece5dc1642ccd73

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - wheel
    - setuptools >=69
  run:
    - python
  run_constrained:
    - tornado >=6.3.0
    - twisted >=24.3.0
    - zope.interface >=6.1

# Tests disabled.
# E   ModuleNotFoundError: No module named '_import_local_thrift'
test:
  source_files:
    - test/test_immutable_exception.py
  imports:
    - thrift
    - thrift.protocol
    - thrift.server
    - thrift.transport
  commands:
    - pip check
    - python -c "import thrift.protocol.fastbinary"
    - python test/test_immutable_exception.py
  requires:
    - pip

about:
  home: https://thrift.apache.org
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  description: |
    Thrift is a lightweight, language-independent software stack for point-to-point RPC implementation.
    Thrift provides clean abstractions and implementations for data transport, data serialization, and application level processing.
  summary: Python bindings for the Apache Thrift RPC system
  dev_url: https://github.com/apache/thrift
  doc_url: https://thrift.apache.org/docs

extra:
  recipe-maintainers:
    - mariusvniekerk
    - ericdill
    - marshall245
